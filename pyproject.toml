[project]
name = "m5-detector-certification"
version = "0.1.0"
description = "Reproduction package for 'Certifying Regime Detectors Before Use' (M5 Research)."
readme = "README.md"
requires-python = ">=3.11"

# Needed to reproduce the paper's values from the frozen artifacts.
dependencies = [
  "numpy>=1.26",
  "scipy>=1.13",
  "matplotlib>=3.8",
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
  "pyarrow>=14.0",
  # Hard module-level imports in src/strategies/vol_regime_switch/. Not
  # optional: importing the certified detectors fails without them. The polars
  # pin is load-bearing for the D-01 warmup length, which is defined by
  # rolling_quantile(min_samples=None) semantics; see the docstring in
  # rolling_quantile_detector.py and tests/wp1/test_polars_semantics.py.
  "polars>=1.41,<2",
  # Hard module-level import in regime_detector, regime_engine, gauge_bars.
  "numba>=0.58",
  "pandas>=2.2",
  "pydantic>=2.0",
]

[project.optional-dependencies]
# The GARCH filter-sensitivity check (a pure-SciPy fallback exists).
extras = ["arch>=8.0"]
# Only to (re)download raw market data for artifact regeneration.
download = ["aiohttp>=3.9", "requests>=2.32"]
dev = ["pytest>=8.2"]

[tool.pytest.ini_options]
addopts = "-ra -m 'not slow and not data'"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "slow: slow tests (deselected by default; run with -m slow)",
  "data: tests requiring local vendor market data not redistributed here",
  "artifact: tests validating frozen research artifacts",
]
